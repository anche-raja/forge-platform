<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/chat.css">
</head>
<!-- The step attribute below is written here rather than by a router: the nine
     wizard steps and route() are gone, so nothing sets it at runtime any more,
     but every rule in chat.css is scoped to it — see the note at the top of that
     file for why that scoping is specificity and not decoration. -->
<body data-step="chat">

<!-- The rail. Thin and quiet: who you are talking to, how to start again, and
     at the bottom what this conversation has cost, how many packs have run and
     which repository is bound. Nothing here navigates — there is nowhere to go.
     #jobbar and #cwd stay because health() in app.js writes to them on every
     poll, and #cwd doubles as the project line once the leader binds a folder. -->
<nav class="steps" id="nav">
  <div class="c-railtop">
    <div class="brand">
      <span class="c-mark" aria-hidden="true">&#10022;</span>
      <span class="c-name">FORGE<span class="sub">J2EE &rarr; Java 21 &middot; Jakarta EE 10 &middot; Liberty</span></span>
    </div>
    <!-- aria-label and title are on the BUTTON because .c-lbl goes display:none
         below 900px: that takes the only real text out of the accessibility
         tree, and the remaining "+" is aria-hidden. Without these the icon
         strip has a button with no name and no tooltip. -->
    <button type="button" id="c-new" class="c-newchat" aria-label="New chat" title="New chat">
      <span class="c-plus" aria-hidden="true">+</span><span class="c-lbl">New chat</span>
    </button>
  </div>
  <div class="c-railfoot">
    <label class="c-trial" title="Runs this turn transform with the cheaper trial_transform_model from agents.yaml (Sonnet 5), about 40% of Opus per file. The run row names the model that did the work.">
      <input type="checkbox" id="c-trial"> <span>Trial run — cheaper model</span>
    </label>
    <div class="c-spend" id="c-spend" hidden></div>
    <div class="c-packs" id="c-packs" hidden></div>
    <div id="jobbar" class="jobbar" hidden></div>
    <div class="c-pathlab" id="cwd-lab" hidden></div>
    <div class="cwd c-path" id="cwd" title="Relative paths resolve against this directory"></div>
  </div>
</nav>

<main id="main">
  <div id="flash" class="flash" hidden></div>

  <section id="step-chat" class="step">
    <!-- .c-pane is the positioning context for the "new messages" pill, so that
         the pill is absolute inside the transcript and can never rise over the
         composer the way a position:fixed one would. -->
    <div class="c-pane">
      <div id="c-transcript">
        <div class="c-col">
          <div id="c-empty">
            <span class="c-mark c-markbig" aria-hidden="true">&#10022;</span>
            <h1>What should FORGE do next?</h1>
            <p class="lead">Say where the repository is and what you want upgraded. Nothing that costs
              money runs without your click.</p>
            <div class="c-suggest" id="c-chips"></div>
          </div>
          <div id="c-items"></div>
        </div>

        <!-- Sticky inside the scroller rather than fixed, so it rises above the
             conversation and still never covers the composer. -->
        <div id="c-applybar" class="applybar" hidden>
          <div class="c-barcol">
            <label class="c-allwrap"><input type="checkbox" id="c-all"> <span id="c-all-label">Approve all</span></label>
            <span class="c-applyn" id="c-apply-n">0 decisions ready</span>
            <button id="c-apply" class="primary" type="button">Apply</button>
            <button id="c-clear" type="button">Clear</button>
            <span class="hint" id="c-apply-hint"></span>
          </div>
        </div>
      </div>

      <button type="button" id="c-jump" class="c-jump" hidden>&darr; New messages</button>
    </div>

    <div id="c-composer">
      <div class="c-col">
        <div id="c-notice" hidden></div>
        <form id="c-form" autocomplete="off">
          <!-- One control: the border, the focus ring and the send button all
               belong to .c-field, and the textarea inside it is bare. -->
          <div class="c-field">
            <textarea id="c-input" rows="1" placeholder="Message FORGE&hellip;"></textarea>
            <button type="submit" id="c-send" class="c-round" aria-label="Send" title="Send">
              <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" focusable="false"><path d="M10 15.5V5.2M5.6 9.6 10 5.2l4.4 4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" id="c-stop" class="c-round c-stopper" aria-label="Stop this turn" title="Stop this turn" hidden>
              <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true" focusable="false"><rect x="4" y="4" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
        <p class="hint" id="c-foot">Enter to send &middot; Shift+Enter for a new line</p>
      </div>
    </div>
  </section>
</main>
<script src="/static/chat.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
